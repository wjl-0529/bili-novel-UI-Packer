name: unsigned iOS IPA
on: [push, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Test
        run: TEST_RUNNER_LIVE_SOURCE_TEST=1 xcodebuild test -scheme BiliNovel -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -resultBundlePath Acceptance.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: native-acceptance-evidence, path: ios/Acceptance.xcresult }
      - name: Archive unsigned
        run: xcodebuild archive -project BiliNovel.xcodeproj -scheme BiliNovel -sdk iphoneos -configuration Release -archivePath build/BiliNovel.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: mkdir -p build/Payload && cp -R build/BiliNovel.xcarchive/Products/Applications/BiliNovel.app build/Payload/ && cd build && zip -r BiliNovel-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: BiliNovel-unsigned-ipa, path: ios/build/BiliNovel-unsigned.ipa }

      - name: Publish IPA direct link
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/BiliNovel-unsigned.ipa build/BiliNovel-1.4.1-unsigned.ipa
          gh release view ios-v1.4.1 --repo "$GH_REPO" || gh release create ios-v1.4.1 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "iOS 1.4.1 · 查找进度与取消修复" --notes "原项目 0.2.49 功能对照：分卷/合并、批量连续/手动、标题、封面、元数据与目录；新增编号导入、独立任务页、日志。已验证 1 号书 444 章无遗漏，5428 27 章及全书正文。Wenku8 在线受 HTTP 403 限制；真实书名搜索仍受源站限制；iOS26模拟器通过，iOS27未实测。无签名 IPA 需要自行签名安装。"
          gh release upload ios-v1.4.1 build/BiliNovel-1.4.1-unsigned.ipa --repo "$GH_REPO" --clobber

