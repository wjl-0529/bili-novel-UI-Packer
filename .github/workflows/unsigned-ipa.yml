name: unsigned iOS IPA
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Test
        run: TEST_RUNNER_LIVE_SOURCE_TEST=1 xcodebuild test -scheme BiliNovel -destination 'platform=iOS Simulator,name=iPhone 17 Pro' CODE_SIGNING_ALLOWED=NO
      - name: Archive unsigned
        run: xcodebuild archive -project BiliNovel.xcodeproj -scheme BiliNovel -sdk iphoneos -configuration Release -archivePath build/BiliNovel.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: mkdir -p build/Payload && cp -R build/BiliNovel.xcarchive/Products/Applications/BiliNovel.app build/Payload/ && cd build && zip -r BiliNovel-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: BiliNovel-unsigned-ipa, path: ios/build/BiliNovel-unsigned.ipa }

      - name: Publish IPA direct link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/BiliNovel-unsigned.ipa build/BiliNovel-1.1.0-unsigned.ipa
          gh release view ios-v1.1.0 --repo "$GH_REPO" || gh release create ios-v1.1.0 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "iOS 1.1.0 · 读取修复" --notes "保留输入域名、备用来源读取、清除旧读取结果；在线验证 5428。"
          gh release upload ios-v1.1.0 build/BiliNovel-1.1.0-unsigned.ipa --repo "$GH_REPO" --clobber
