name: Verify upstream Wenku access
on:
  push:
    paths: ['.github/workflows/source-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    steps:
      - run: |
          python3 - <<'PYCODE'
          import urllib.request
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36'
          for host in ['www.wenku8.net','www.wenku8.cc','www.wenku8.com']:
              try:
                  u='https://'+host+'/book/1.htm'
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':ua}),timeout=25)
                  b=r.read();print('WENKU',host,r.status,len(b),b[:100])
              except Exception as e:print('WENKU',host,e)
          PYCODE

