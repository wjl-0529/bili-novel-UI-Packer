name: Inspect chapter response
on:
  push:
    paths: ['.github/workflows/source-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    steps:
      - run: |
          python3 - <<'PYCODE'
          import urllib.request,re,time
          agents={
          'android':'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36',
          'safari':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1',
          'desktop':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'}
          for host in ['www.bilinovel.com','www.bilinovel.net','www.linovelib.com','tw.linovelib.com']:
              for name,ua in agents.items():
                  try:
                      time.sleep(6)
                      u='https://'+host+'/novel/5428/337894.html'
                      s=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':ua,'Referer':'https://'+host+'/','Cookie':'night=0','Accept-Language':'zh-CN,zh;q=0.9'}),timeout=25).read().decode('utf-8')
                      m=re.search(r'<div id="acontent".*?</div>',s,re.S)
                      body=m.group(0) if m else s
                      print('RESULT',host,name,len(s),len(body),body[:180],body[-220:])
                  except Exception as e: print('FAIL',host,name,e)
          PYCODE
