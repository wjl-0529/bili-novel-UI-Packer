name: Inspect complete book 1 catalog
on:
  push:
    paths: ['.github/workflows/source-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    steps:
      - run: |
          python3 - <<'PYCODE'
          import urllib.request,re,collections,time
          from html.parser import HTMLParser
          ua='Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36'
          for agent in [ua,'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36']:
              try:
                  req=urllib.request.Request('https://www.linovelib.com/novel/1/catalog',headers={'User-Agent':agent,'Cookie':'night=0'})
                  h=urllib.request.urlopen(req,timeout=25).read().decode('utf-8')
                  print('AGENT',agent,'BYTES',len(h),'TOTAL',re.findall(r'共.{0,20}章',h))
                  rows=re.findall(r'<li\b[^>]*>.*?</li>',h,re.S)
                  counts=collections.Counter()
                  for row in rows:
                      cl=re.search(r'class=[\"\'](.*?)[\"\']',row)
                      counts[cl.group(1) if cl else 'none']+=1
                      if 'jsChapter' not in row and ('/novel/1/' in row or 'chapter' in row.lower()): print('OTHER_ROW',row[:1500])
                  print('ROW_COUNTS',counts)
                  print('ALL_CHAPTER_ROWS',len([x for x in rows if 'jsChapter' in x]))
                  if agent != ua:
                      volume_paths=list(dict.fromkeys(re.findall(r'/novel/1/vol_\d+\.html',h)))
                      chapter_paths=set(re.findall(r'/novel/1/\d+\.html',h))
                      total=0; volume_chapters=set()
                      for path in volume_paths:
                          time.sleep(4)
                          v=urllib.request.urlopen(urllib.request.Request('https://www.linovelib.com'+path,headers={'User-Agent':agent,'Cookie':'night=0'}),timeout=25).read().decode('utf-8')
                          count=re.search(r'章节目录.*?\((\d+)\)',v,re.S)
                          links=set(re.findall(r'/novel/1/\d+\.html',v))
                          print('VOLUME_AUDIT',path,'reported',count.group(1) if count else None,'links',len(links))
                          assert count is not None and int(count.group(1)) == len(links)
                          total+=len(links);volume_chapters.update(links)
                      print('FULL_VOLUME_AUDIT',len(volume_paths),total,len(volume_chapters),'missing_in_main',sorted(volume_chapters-chapter_paths),'missing_in_volumes',sorted(chapter_paths-volume_chapters))
                      assert len(volume_paths)==38 and total==444 and len(volume_chapters)==444 and volume_chapters==chapter_paths
                  print('HEAD',h[:3000])
                  print('TAIL',h[-4000:])
              except Exception as e: print('ERROR',repr(e)); raise
          PYCODE


