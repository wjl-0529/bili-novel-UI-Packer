name: Inspect chapter response
on:
  push:
    paths: ['.github/workflows/source-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    steps:
      - run: |
          python3 - <<'PYCODE'
          import urllib.request,re,time
          ua='Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36'
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':ua,'Referer':u,'Cookie':'night=0'}),timeout=30).read().decode('utf-8')
          s=get('https://www.linovelib.com/novel/5428/catalog')
          links=re.findall(r'href=["\']([^"\']+/[0-9]+\.html)',s)
          print('links',links[:3])
          path=next(x for x in links if '/5428/' in x)
          for host in ['https://www.linovelib.com','https://www.bilinovel.net']:
              try:
                  time.sleep(6)
                  html=get(host+path if path.startswith('/') else path)
                  print('HOST',host,'LENGTH',len(html))
                  print(html)
                  for script in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',html):
                      if 'readtools' in script or 'chapterlog' in script:
                          import urllib.parse
                          print('SCRIPT',script,get(urllib.parse.urljoin(host,script)))
              except Exception as e:print(e)
          PYCODE

